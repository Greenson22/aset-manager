name: Build & Package PyInstaller

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: aset-manager-windows.exe
            pyinstaller_args: "--noconsole"
          - os: ubuntu-latest
            artifact_name: aset-manager-linux
            pyinstaller_args: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglx-mesa0 libglib2.0-0 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile ${{ matrix.pyinstaller_args }} --name aset-manager main.py

      - name: Prepare Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item -Path "dist/aset-manager.exe" -Destination "dist/${{ matrix.artifact_name }}"

      - name: Prepare Artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/aset-manager
          mv dist/aset-manager dist/${{ matrix.artifact_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/aset-manager-windows.exe/*
            artifacts/aset-manager-linux/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
